name: ci

on:
  pull_request:
    paths: ["tools/**", "data/**", ".github/workflows/ci.yml"]
  push:
    branches: [master]
    paths: ["tools/**", "data/**"]

jobs:
  slim-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build both slim variants from the shards and check them
        run: python -m unittest discover -s tools -v
