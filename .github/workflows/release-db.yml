name: release-db

# Builds the slim app databases from the shards, publishes them as a private release and uploads
# them to the private Supabase Storage bucket "products".
# Run it from the Actions tab (db_version like 2026.10.18). The app pins the sha256 from checksums.txt.
on:
  workflow_dispatch:
    inputs:
      db_version:
        description: "Database version, for example 2026.10.18"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tools -v

      - name: Fetch the previous release of both variants (to keep old ids resolvable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev
          # Each variant is compared with its own previous file, so ids that vanished are in `removed`.
          # Only a repo with no db-* release yet may build without --previous; any download error fails the job.
          if ! gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -q '^db-'; then
            echo "No previous db-* release, building both variants without an id check"
            exit 0
          fi
          gh release download --pattern 'products.sqlite.gz' --pattern 'products-open.sqlite.gz' --dir prev
          gunzip -f prev/products.sqlite.gz prev/products-open.sqlite.gz
          echo "PREVIOUS_FULL=--previous prev/products.sqlite" >> "$GITHUB_ENV"
          echo "PREVIOUS_OPEN=--previous prev/products-open.sqlite" >> "$GITHUB_ENV"

      - name: Build both variants
        env:
          VERSION: ${{ inputs.db_version }}
        run: |
          mkdir -p out
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python tools/build_slim.py --data data --out out/products.sqlite --db-version "$VERSION" \
            --variant full --built-at "$BUILT_AT" --source-commit "$GITHUB_SHA" $PREVIOUS_FULL
          python tools/build_slim.py --data data --out out/products-open.sqlite --db-version "$VERSION" \
            --variant open --built-at "$BUILT_AT" --source-commit "$GITHUB_SHA" $PREVIOUS_OPEN
          sha256sum out/products.sqlite out/products-open.sqlite > out/checksums.txt
          gzip -9 -k out/products.sqlite out/products-open.sqlite
          sha256sum out/products.sqlite.gz out/products-open.sqlite.gz >> out/checksums.txt
          cat out/checksums.txt

      - name: Publish the private release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.db_version }}
        run: |
          gh release create "db-$VERSION" out/products.sqlite.gz out/products-open.sqlite.gz out/checksums.txt \
            --title "Product database $VERSION" \
            --notes "Slim app databases built from the shards at $GITHUB_SHA. checksums.txt has the sha256 of each file, compressed and uncompressed. The app pins the uncompressed products.sqlite checksum."

      # Repo secrets SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY (Makro's project, see README).
      # Uploads to the private "products" bucket: db-<version>/ for this version, the newest files
      # at the bucket root (upsert), and latest.json last.
      - name: Upload to the Supabase bucket
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERSION: ${{ inputs.db_version }}
        run: python tools/upload_to_bucket.py --dir out --db-version "$VERSION"
